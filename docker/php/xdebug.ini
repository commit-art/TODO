zend_extension=xdebug.so

xdebug.mode=develop,debug
xdebug.start_with_request=yes
xdebug.client_host=172.17.0.1
xdebug.client_port=9003
xdebug.log_level=10
#xdebug.log=/var/log/xdebug.log


# 1. Add current user to the docker group "sudo usermod -aG docker $USER" -> "getent group docker"
# 2. Add rule to UFW "sudo ufw allow 9003/tcp"
# 3. Settings-> PHP Set correct mappings "/var/www/TodoListApi; /var/www"
# 4. Settings-> PHP -> Servers "localhost:80"
# 5. See diagnostic Log in xdebug_info()
